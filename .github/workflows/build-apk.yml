name: Build Signed Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 使用 GitHub 官方 Gradle Actions 自動安裝適當 Gradle 版本
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # 如果 Repo 內缺乏 Wrapper，自動生成
      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found, generating wrapper via system Gradle..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      # 雲端自動生成固定的 Key，保證每次打包都是同一把 Key (可直接覆蓋更新)
      - name: Generate Keystore if not exists
        run: |
          mkdir -p app
          if [ ! -f app/release-key.jks ]; then
            keytool -genkey -v -keystore app/release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias my-alias \
              -dname "CN=LifeApp, OU=Dev, O=Self, L=HK, S=HK, C=HK" \
              -storepass mypassword -keypass mypassword
          fi

      - name: Build Release APK
        env:
          KEY_ALIAS: "my-alias"
          KEY_PASSWORD: "mypassword"
          STORE_PASSWORD: "mypassword"
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeApp-Release-APK
          path: app/build/outputs/apk/release/*.apk
