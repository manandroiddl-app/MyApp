name: Build Signed Android APK

on:
  # 允許在 GitHub 網頁介面上手動點擊按鈕觸發
  workflow_dispatch:

  # （可選）如果你仍想保留只有在 PR 合併時才 Build，可以保留這幾行；否則只需保留 workflow_dispatch
  # pull_request:
  #   branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 升級為官方建議的 @v5 版本
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 手動處理 Gradle 環境，避開第三方 Action 的 Node 警告
      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.5/bin" >> $GITHUB_PATH

      # 🌟 已校正：自動生成 app/debug.keystore (參數與 build.gradle.kts 完美對齊，確保每次簽名相同且能覆蓋更新)
      - name: Generate Keystore if not exists
        run: |
          mkdir -p app
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias androiddebugkey \
              -dname "CN=LifeApp, OU=Dev, O=Self, L=HK, S=HK, C=HK" \
              -storepass android -keypass android
          fi

      - name: Build Release APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeApp-Release-APK
          path: app/build/outputs/apk/release/*.apk
