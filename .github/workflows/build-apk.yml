name: Build Signed Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 使用 Gradle 最新版 Actions (@v4) 處理環境與快取
      - name: Setup and Build with Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          # 如果 GitHub 快取服務不穩定，允許跳過 Cache 以免洗版報錯
          cache-read-only: false

      # 雲端自動生成固定的 Key，保證每次打包都是同一把 Key (可直接覆蓋更新)
      - name: Generate Keystore if not exists
        run: |
          mkdir -p app
          if [ ! -f app/release-key.jks ]; then
            keytool -genkey -v -keystore app/release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias my-alias \
              -dname "CN=LifeApp, OU=Dev, O=Self, L=HK, S=HK, C=HK" \
              -storepass mypassword -keypass mypassword
          fi

      - name: Build Release APK
        env:
          KEY_ALIAS: "my-alias"
          KEY_PASSWORD: "mypassword"
          STORE_PASSWORD: "mypassword"
        run: |
          if [ -f ./gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: LifeApp-Release-APK
          path: app/build/outputs/apk/release/*.apk
