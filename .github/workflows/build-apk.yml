name: Build Signed Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 賦予 GitHub Actions 寫入/Commit 檔案回 repository 的權限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.5/bin" >> $GITHUB_PATH

      # 🌟 自動產生固定的 Keystore 並 Commit 存回 Repository (只需執行一次，以後永遠沿用)
      - name: Ensure Fixed Keystore Exists and Saved to Repo
        run: |
          mkdir -p app
          if [ ! -f app/debug.keystore ]; then
            echo "Generating brand new fixed debug.keystore..."
            keytool -genkey -v -keystore app/debug.keystore \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias androiddebugkey \
              -dname "CN=LifeApp, OU=Dev, O=Self, L=HK, S=HK, C=HK" \
              -storepass android -keypass android

            echo "Saving debug.keystore to git repository..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f app/debug.keystore
            git commit -m "ci: auto-generate and save permanent fixed debug.keystore [skip ci]"
            git push
          else
            echo "✅ Using existing permanent debug.keystore from repository!"
          fi

      - name: Build Release APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeApp-Release-APK
          path: app/build/outputs/apk/release/*.apk
